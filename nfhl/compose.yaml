services:
  nfhl-draftboard:
    image: mlf_tools:latest
    container_name: nfhl_draftboard
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./:/league_runtime
    ports:
      - "8504:8501"
    networks:
      - mlf_net
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

networks:
  mlf_net:
    external: true
